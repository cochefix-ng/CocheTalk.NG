openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: diagnose
    description: AI vehicle diagnostics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /diagnose:
    post:
      operationId: diagnoseVehicle
      tags: [diagnose]
      summary: AI vehicle diagnostics
      description: Uses Gemini AI to diagnose a vehicle issue from a text description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnoseRequest"
      responses:
        "200":
          description: Diagnosis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnoseResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DiagnoseRequest:
      type: object
      properties:
        description:
          type: string
      required:
        - description
    DiagnoseResponse:
      type: object
      properties:
        result:
          type: string
      required:
        - result
