packages:
  - apps/*
  - packages/*

catalog:
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  # Must be this exact version because Expo SDK 57 requires it
  react: 19.2.3
  # Must be this exact version because Expo SDK 57 requires it
  react-dom: 19.2.3
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver
  - browser-tabs-lock
  - core-js

allowBuilds:
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  utf-8-validate: true
