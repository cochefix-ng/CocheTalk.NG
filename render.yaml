services:
  - type: web
    name: cochetalk-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install -g pnpm@9 && pnpm install --filter @workspace/api-server... --no-frozen-lockfile && pnpm build:api
    startCommand: pnpm start:api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
